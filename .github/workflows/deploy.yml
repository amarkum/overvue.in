name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deploy that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so sitemap.xml can date each page by its last commit

      - name: Generate pages, sitemap.xml and llms.txt
        run: python3 tools/build_pages.py

      - uses: actions/configure-pages@v6

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'tools' --exclude 'README.md' \
            ./ _site/
          test -f _site/index.html
          test -f _site/privacy-policy/index.html
          test -f _site/terms-of-service/index.html
          test -f _site/sitemap.xml
          test -f _site/llms.txt

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
